name: Browser checks

on:
  pull_request:
    paths: ["build.py", "rights.toml", "web/**", "tests/**", ".github/workflows/browser.yml"]
  push:
    branches: [main]
    paths: ["build.py", "rights.toml", "web/**", "tests/**", ".github/workflows/browser.yml"]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v
      - run: python -m tests.browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: work/browser/*.png
