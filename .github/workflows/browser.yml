name: Browser checks

on:
  pull_request:
    paths: ["**/*.py", "settings.toml", "rights.toml", "web/**", "tests/**", ".github/workflows/**", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["**/*.py", "settings.toml", "rights.toml", "web/**", "tests/**", ".github/workflows/**", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  browser:
    name: Browser checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            args: ""
          - browser: webkit
            args: "--smoke"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps "${{ matrix.browser }}"
      - run: python -m tests.browser --browser "${{ matrix.browser }}" ${{ matrix.args }} --artifacts "work/browser-${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: work/browser-${{ matrix.browser }}/*.png
          if-no-files-found: ignore
          retention-days: 14
