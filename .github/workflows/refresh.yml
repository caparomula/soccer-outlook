# Builds the schedule from ESPN and publishes it to the gh-pages branch.
# AI configuration lives in settings.toml. Full research is generated daily and reused later
# that day. The ratings-only design can also fill missing ratings and optional text.
# Ordinary code pushes keep the published result unless the AI setup changed or a partial run needs finishing.
# API keys are repository secrets; the schedule still publishes when AI is unavailable.
#
# Tests and the builder's source report gate publication. A healthy quiet or empty schedule is
# valid. Generated pages, facts and reports are retained as artifacts for 14 days, including on
# failed runs, because gh-pages is replaced with a single commit on each successful publication.
# Match metrics and available ratings are also appended to match-history without an expiry.
# Archiving must succeed before the page can be published.
# Broadcast mapping warnings maintain one issue labelled "mapping" after publication.
#
# Schedules use UTC and GitHub may start them late. The runs land at 5:50 am, 12:50 pm and
# 6:50 pm Eastern daylight time, an hour earlier in standard time. The morning run remains
# after the page's 4 am day boundary in both offsets.
name: Refresh outlook

on:
  schedule:
    - cron: "50 9 * * *"
    - cron: "50 16 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      storylines:
        description: "AI: update today's, write new ones from scratch, or keep today's (the ratings design rates for either of the first two)"
        type: choice
        options: [refresh, full, keep]
        default: refresh
  push:
    branches: [main]
    paths: ["**/*.py", "settings.toml", "rights.toml", "watch-links.toml", "content/shared-ai.json", "content/match-observations.json", "web/**", "tests/**", "companion-toolchain.json", "packages/outlook_core/**", "packages/outlook_data/**", "tool/outlook_bridge/**", "tool/companion_p0_limits.json", ".github/workflows/**", ".github/scripts/**", ".github/actions/outlook-runtime/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v5
      - name: Skip superseded source revisions
        run: bash .github/scripts/check-current-revision.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/outlook-runtime

      - name: Install test dependencies
        run: python3 -m pip install -r tests/requirements-companion.txt

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Browser checks
        # The page's script runs only in a browser, where the unit tests can't see it, so a check that
        # fails keeps the last good page up; before the storylines, it costs no API calls. No apt-get:
        # GitHub's image already has Chromium's libraries, and on 7 October an Ubuntu mirror stalled
        # this step for 17 minutes. If the browser can't be installed or started, which says nothing
        # about the page, it is published without the checks and the run says so (browser.yml still
        # checks every push).
        timeout-minutes: 10
        run: |
          if ! { python3 -m venv .browser-venv &&
                 timeout 180 .browser-venv/bin/pip install --quiet -r tests/requirements-browser.txt -r tests/requirements-companion.txt &&
                 timeout 300 .browser-venv/bin/python -m playwright install chromium; }; then
            echo "::warning::Couldn't install the browser for the checks; publishing without them."
            exit 0
          fi
          status=0
          .browser-venv/bin/python -m tests.browser || status=$?
          if [ "$status" -eq 0 ]; then
            .browser-venv/bin/python -m tests.browser_schedule || status=$?
          fi
          if [ "$status" -eq 77 ]; then     # tests/browser.py: Chromium couldn't start
            echo "::warning::Chromium couldn't start; publishing without the browser checks."
            exit 0
          fi
          exit "$status"

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: work/browser/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Read previous broadcast evidence and companion history
        run: |
          mkdir -p work
          if git fetch -q --no-tags --depth=1 origin gh-pages; then
            python3 .github/scripts/restore-outlook-runtime.py --ref FETCH_HEAD --out site
            git show FETCH_HEAD:schedule-context.json > work/previous-context.json || rm -f work/previous-context.json
            if git cat-file -e FETCH_HEAD:api 2>/dev/null; then
              mkdir -p work/previous-publication site
              git archive FETCH_HEAD api | tar -x -C work/previous-publication
              cp -R work/previous-publication/api site/api
            fi
          else
            # A disabled exporter must also retain a previously published API.
            # Only a conclusive absent branch permits a first publication.
            status=0
            git ls-remote --exit-code origin refs/heads/gh-pages > /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Cannot read durable published history; keeping the published site."
              exit 1
            fi
          fi

      - name: Build the page
        env:
          COMPANION_FEED_ENABLED: ${{ vars.COMPANION_FEED_ENABLED }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          bash .github/scripts/check-current-revision.sh
          companion=()
          if [ "$COMPANION_FEED_ENABLED" = true ]; then
            previous_api=none
            if [ -d work/previous-publication/api ]; then
              previous_api=work/previous-publication/api/v1
            fi
            companion=(--companion-feed --companion-previous-api "$previous_api" --companion-producer-revision "$GITHUB_SHA" --companion-stage work/companion-stage.json)
          fi
          python3 build.py --out site/index.html --site-url "$SITE_URL" --facts work/facts.json --metrics work/metrics.json --warnings work/mapping-report.txt --report work/build-report.json --previous-context work/previous-context.json "${companion[@]}"

      - name: Check the page
        run: python3 .github/scripts/check-build.py --page site/index.html --report work/build-report.json

      - name: Write the AI ratings and storylines
        continue-on-error: true
        timeout-minutes: 90
        env:
          COMPANION_FEED_ENABLED: ${{ vars.COMPANION_FEED_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.storylines }}
        run: |
          bash .github/scripts/check-current-revision.sh
          site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          previous=()
          if curl -fsS --max-time 30 "${site_url}/story.json" -o work/previous-story.json; then
            previous=(--previous work/previous-story.json)
          fi
          case "$EVENT" in
            schedule) mode=daily ;;     # the day's story once, by its first scheduled build; later builds keep it
            workflow_dispatch) mode="${WANT:-refresh}" ;;
            *) mode=keep         # a code push keeps accepted news, resumes a partial run, or recovers a missing result
               # ...unless the live page was built with AI off: then this push is the switch coming back
               # on (or another change while it is off, when story.py calls nothing anyway).
               if [ "${#previous[@]}" -eq 0 ]; then
                 mode=daily
               elif curl -fsS --max-time 30 "${site_url}/" -o work/live.html && grep -q 'data-ai="off"' work/live.html; then
                 mode=daily
               fi ;;
          esac
          echo "storyline mode: ${mode}"
          # Save a compatible, fresh result before setup or generation: even a timeout leaves it
          # publishable. These planning operations make no API requests and need no SDK.
          story_args=(--facts work/facts.json --out site/story.json "${previous[@]}" --mode "$mode")
          if [ "$COMPANION_FEED_ENABLED" = true ]; then
            story_args+=(--companion-bindings)
          fi
          python3 story.py "${story_args[@]}" --fallback-only
          sdk=$(python3 story.py "${story_args[@]}" --needs-sdk)
          story_python=python3
          if [ "$sdk" = anthropic ]; then
            python3 -m venv .venv
            timeout 180 .venv/bin/pip install --quiet "anthropic>=1.11,<2"
            story_python=.venv/bin/python
          fi
          "$story_python" story.py "${story_args[@]}" --usage-out work/usage.json

      - name: Finalize opt-in companion publication
        if: vars.COMPANION_FEED_ENABLED == 'true'
        run: |
          bash .github/scripts/check-current-revision.sh
          python3 .github/scripts/companion-feed.py --stage work/companion-stage.json --api-dir site/api/v1 --automatic site/story.json --shared site/shared-ai.json

      - name: Archive match metrics and ratings
        run: |
          bash .github/scripts/check-current-revision.sh
          bash .github/scripts/archive-history.sh

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/check-current-revision.sh
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Page built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Raise or clear the mapping issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ github.repository_owner }}
        run: .github/scripts/mapping-issue.sh work/mapping-report.txt

      - name: Keep the generated site and source reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: |
            site/
            work/facts.json
            work/metrics.json
            work/history-snapshot.json.gz
            work/mapping-report.txt
            work/build-report.json
            work/usage.json
            work/companion-stage.json
          if-no-files-found: ignore
          retention-days: 14
