# Rebuilds the page from ESPN's public data, adds the day's storylines, and publishes to GitHub Pages.
#
# Pages serves the gh-pages branch. Each run replaces that branch with a single commit holding the
# new page, so the branch never accumulates history, and the daily push keeps the repository active
# (GitHub disables scheduled workflows in public repositories after 60 days without activity).
#
# Storylines (story.py) are written by Claude with web search on every scheduled build, in story.py's
# auto mode: the first run of the day researches from scratch and rates every fixture, later runs
# update that story for the moment (results, team news, lineups) and re-rate only the next 24 hours,
# and a run that starts within three hours of the last one keeps it, since GitHub can start a
# schedule hours late, right before the next. A build after a code push republishes the current
# story without calling Claude; a manual run chooses.
# The model and effort can be changed without editing code, through the repository variables
# STORY_MODEL, STORY_EFFORT and STORY_REFRESH_EFFORT (Settings, Secrets and variables, Actions,
# Variables); story.py has the defaults. Storylines need the ANTHROPIC_API_KEY repository secret.
# Without it, or if the call fails, the page is published with the day's earlier story, or none.
#
# Which services carry which channels, and where each competition usually lives, is in rights.toml.
# The unit tests (rights data, storyline checks, rendering) and the browser checks run before the
# build, so a contradictory edit or a broken page script keeps the last good page up (and GitHub
# emails about the failed run). Each build also reports what it couldn't map or vouch for, and
# keeps one issue labelled "mapping" open while that report has anything in it.
#
# Schedules are in UTC and GitHub may start them late when it is busy. The three runs land at about
# 4:50 am, 12:50 pm and 6:50 pm Eastern daylight time, an hour earlier in standard time.
name: Refresh outlook

on:
  schedule:
    - cron: "50 8 * * *"
    - cron: "50 16 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      storylines:
        description: "Storylines: update today's, write new ones from scratch, or keep today's"
        type: choice
        options: [refresh, full, keep]
        default: refresh
  push:
    branches: [main]
    paths: ["build.py", "story.py", "rights.toml", "web/**", "tests/**", ".github/workflows/refresh.yml", ".github/scripts/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Browser checks
        # The page's script runs only in a browser, where the unit tests can't see it; a change that
        # breaks it must not be published. Before the storylines, so a failure costs no API calls.
        run: |
          python3 -m venv .browser-venv
          .browser-venv/bin/pip install --quiet -r tests/requirements-browser.txt
          .browser-venv/bin/python -m playwright install --with-deps chromium
          .browser-venv/bin/python -m tests.browser

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: work/browser/*.png

      - name: Build the page
        run: python3 build.py --out site/index.html --facts work/facts.json --warnings work/mapping-report.txt

      - name: Check the page
        run: |
          size=$(stat -c %s site/index.html)
          rows=$(grep -o '<li class="row ' site/index.html | wc -l)
          echo "page ${size} bytes, ${rows} matches"
          if [ "$size" -lt 200000 ] || [ "$rows" -lt 50 ]; then
            echo "::error::The page looks incomplete (${size} bytes, ${rows} matches); keeping the published one."
            exit 1
          fi

      - name: Write storylines
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.storylines }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
          STORY_EFFORT: ${{ vars.STORY_EFFORT }}
          STORY_REFRESH_EFFORT: ${{ vars.STORY_REFRESH_EFFORT }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "anthropic>=1.11,<2"
          site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          previous=()
          if curl -fsS --max-time 30 "${site_url}/story.json" -o work/previous-story.json; then
            previous=(--previous work/previous-story.json)
          fi
          case "$EVENT" in
            schedule) mode=auto ;;      # full for a new day, refresh later, keep if the last run was recent
            workflow_dispatch) mode="${WANT:-refresh}" ;;
            *) mode=keep ;;      # a code push: the news hasn't changed
          esac
          echo "storyline mode: ${mode}"
          .venv/bin/python story.py --facts work/facts.json --out site/story.json "${previous[@]}" --mode "$mode"

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Page built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Raise or clear the mapping issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ github.repository_owner }}
        run: .github/scripts/mapping-issue.sh work/mapping-report.txt
