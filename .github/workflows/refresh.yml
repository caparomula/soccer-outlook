# Rebuilds the page from ESPN's public data, adds the day's storylines, and publishes to GitHub Pages.
#
# Pages serves the gh-pages branch. Each run replaces that branch with a single commit holding the
# new page, so the branch never accumulates history, and the daily push keeps the repository active
# (GitHub disables scheduled workflows in public repositories after 60 days without activity).
#
# The AI's part (story.py) is chosen in settings.toml's [ai] table: whether there is one, its design
# and which model does it, at what effort. The ratings design (gpt-6.1-sol since 8 October 2026)
# rates matches for today and the three following days once a day, about $0.06 a run (an overview and blurbs for
# the top picks can be added, each by a model that searches the web, but are off); the full design has
# Claude research and write the overview and blurbs too, about $1.80. Either way the day's run is the first
# scheduled build of the day (normally the early-morning one; if it fails or GitHub never starts it,
# the next one), and the midday and evening builds, which still refresh fixtures, channels and scores,
# keep it. A build after a code push republishes the current story without calling anything, unless
# the push changed the [ai] choice: then the published story was written by another model or design,
# and the push writes the day's with the new one at once. A manual run chooses. Each provider needs its
# key as a repository secret (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY); without the one the
# model needs, or if the call fails, the page is published with the day's earlier story, or none.
# settings.toml's [ai] enabled switches the AI off and on: off, story.py calls nothing and writes
# nothing, so the page is published without AI text or ratings; the push that switches it back on
# finds the live page built with AI off and writes the day's at once, instead of at the next morning build.
#
# Which services carry which channels, and where each competition usually lives, is in rights.toml.
# The unit tests (rights data, storyline checks, rendering) and the browser checks run before the
# build, so a contradictory edit or a broken page script keeps the last good page up (and GitHub
# emails about the failed run). Each build also reports what it couldn't map or vouch for, and
# keeps one issue labelled "mapping" open while that report has anything in it.
#
# Schedules are in UTC and GitHub may start them late when it is busy. The three runs land at about
# 4:50 am, 12:50 pm and 6:50 pm Eastern daylight time, an hour earlier in standard time.
name: Refresh outlook

on:
  schedule:
    - cron: "50 8 * * *"
    - cron: "50 16 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      storylines:
        description: "AI: update today's, write new ones from scratch, or keep today's (the ratings design rates for either of the first two)"
        type: choice
        options: [refresh, full, keep]
        default: refresh
  push:
    branches: [main]
    paths: ["build.py", "story.py", "providers.py", "settings.toml", "rights.toml", "web/**", "tests/**", ".github/workflows/refresh.yml", ".github/scripts/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Browser checks
        # The page's script runs only in a browser, where the unit tests can't see it, so a check that
        # fails keeps the last good page up; before the storylines, it costs no API calls. No apt-get:
        # GitHub's image already has Chromium's libraries, and on 7 October an Ubuntu mirror stalled
        # this step for 17 minutes. If the browser can't be installed or started, which says nothing
        # about the page, it is published without the checks and the run says so (browser.yml still
        # checks every push).
        timeout-minutes: 10
        run: |
          if ! { python3 -m venv .browser-venv &&
                 timeout 180 .browser-venv/bin/pip install --quiet -r tests/requirements-browser.txt &&
                 timeout 300 .browser-venv/bin/python -m playwright install chromium; }; then
            echo "::warning::Couldn't install the browser for the checks; publishing without them."
            exit 0
          fi
          status=0
          .browser-venv/bin/python -m tests.browser || status=$?
          if [ "$status" -eq 77 ]; then     # tests/browser.py: Chromium couldn't start
            echo "::warning::Chromium couldn't start; publishing without the browser checks."
            exit 0
          fi
          exit "$status"

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: work/browser/*.png

      - name: Build the page
        run: python3 build.py --out site/index.html --facts work/facts.json --warnings work/mapping-report.txt

      - name: Check the page
        run: |
          size=$(stat -c %s site/index.html)
          rows=$(grep -o '<li class="row ' site/index.html | wc -l)
          echo "page ${size} bytes, ${rows} matches"
          if [ "$size" -lt 200000 ] || [ "$rows" -lt 50 ]; then
            echo "::error::The page looks incomplete (${size} bytes, ${rows} matches); keeping the published one."
            exit 1
          fi

      - name: Write the AI ratings and storylines
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.storylines }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "anthropic>=1.11,<2"
          site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          previous=()
          if curl -fsS --max-time 30 "${site_url}/story.json" -o work/previous-story.json; then
            previous=(--previous work/previous-story.json)
          fi
          case "$EVENT" in
            schedule) mode=daily ;;     # the day's story once, by its first scheduled build; later builds keep it
            workflow_dispatch) mode="${WANT:-refresh}" ;;
            *) mode=keep         # a code push: the news hasn't changed (story.py writes anyway if the [ai] choice did)...
               # ...unless the live page was built with AI off: then this push is the switch coming back
               # on (or another change while it is off, when story.py calls nothing anyway).
               if curl -fsS --max-time 30 "${site_url}/" -o work/live.html && grep -q 'data-ai="off"' work/live.html; then
                 mode=daily
               fi ;;
          esac
          echo "storyline mode: ${mode}"
          .venv/bin/python story.py --facts work/facts.json --out site/story.json "${previous[@]}" --mode "$mode"

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Page built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Raise or clear the mapping issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ github.repository_owner }}
        run: .github/scripts/mapping-issue.sh work/mapping-report.txt
