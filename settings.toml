# Soccer Outlook configuration. See docs/development.md and docs/scoring.md.
# build.py validates these settings; malformed settings stop the build.
# A push to main rebuilds the page. Changing the AI configuration can also trigger a paid AI run.

# AI ratings are generated daily; later scheduled runs fill missing ratings or optional text.
# Accepted same-day ratings are reused. enabled=false disables AI requests,
# ratings and text. The page then recommends matches using the Outlook score and league priority.
#
# design="ratings" asks for scores from the supplied fixture facts, without research or prose.
# design="full" adds researched news and match blurbs, and requires a supported Claude research
# model. Supported models and effort levels are listed in providers.py.
#
# Add the selected provider's key as a repository secret: OPENAI_API_KEY, ANTHROPIC_API_KEY or
# GEMINI_API_KEY. A missing key may retain today's earlier output; use enabled=false to turn AI off.
#
# In the ratings design, uncomment either optional model/effort pair to add a researched overview
# or blurbs for six top-ranked fixtures. These are additional paid requests. The optional overview
# covers all services and competitions and is the same for every visitor. Optional blurbs cover
# only the researched candidates, so not every visitor's selected card will have one.

[ai]
enabled = true
design = "ratings"
model = "gpt-6.1-sol"
effort = "low"
# overview_model = "gemini-3.1-pro-preview"
# overview_effort = "medium"
# blurbs_model = "gpt-6.1-sol"
# blurbs_effort = "medium"

# Both pairs are relative weights, normalized by their sum. Each pair must include a positive value.
# First blend the AI rating with the Outlook score to get match interest. Without a rating, use the
# Outlook score alone. Then blend interest with the viewer's league priority to get the pick score.
# League priority runs evenly from 100 to 0 over the full league list, including disabled leagues.
# At the defaults, moving a league from last to first adds up to five points to its matches.

[blend]
ai = 70
outlook = 30
interest = 95
league_priority = 5

# Four strictly increasing score thresholds, above 0 and at most 100.
# Below the first threshold shows one golden dot; reaching each threshold adds another dot.
# These are fixed scores, not percentiles of the day's matches.

[dots]
thresholds = [35, 45, 55, 68]

# The Outlook score uses ESPN data and no AI. Each component ranges from 0 to 1:
# stature: competition tier and prominent teams, divided by stature_full and capped at 1.
# close: implied draw probability, scaled from draw_from (0) to draw_to (1).
# stakes: table positions, including bottom-of-table meetings scaled by bottom; known knockout
#         stages use the longest matching keyword in knockout instead.
# tv: a listed broadcast network (1), cable channel (0.5), or neither (0).
# goals: the total-goals line, scaled from goals_from (0) to goals_to (1).
#
# Missing inputs use missing (0.5 by default) and keep their component's weight. They are not
# dropped from the calculation. Odds come from the first odds entry in ESPN's scoreboard;
# they influence the score but are not displayed. Channel names must match rights.toml.

[outlook]
weights = { stature = 40, close = 25, stakes = 15, tv = 10, goals = 10 }
missing = 0.5
stature_full = 150
draw_from = 0.10
draw_to = 0.30
bottom = 0.6
goals_from = 2.0
goals_to = 4.0
knockout = { "final" = 1.0, "semifinal" = 0.9, "quarterfinal" = 0.8, "round of 16" = 0.7, "playoff" = 0.7 }
network = ["ABC", "CBS", "FOX", "NBC", "Telemundo", "Univision", "UniMás"]
cable = ["ESPN", "ESPN2", "ESPN Deportes", "FS1", "FS2", "Fox Deportes", "USA Network", "CBS Sports Network",
         "TNT", "TBS", "truTV", "TUDN", "Universo", "beIN Sports", "beIN Sports en Español"]
