# Soccer Outlook settings: whether an AI model takes part and which one, and how the page scores matches.
#
# A commit to main rebuilds the page, so a change here, even one made in GitHub's web editor, is live
# within a few minutes. Each build checks this file and refuses to publish if it is malformed, listing
# every problem it finds; `python3 -m unittest -v` runs the same checks before you push.


# ---- AI ------------------------------------------------------------------------------------------
# The AI's part of the page, done once a day by story.py, early in the morning.
#
#   enabled  false: nothing calls an AI model; the page shows no AI-written text and no AI rating,
#            and picks matches by the Outlook score and league priority.
#   design   "ratings": the model rates every match kicking off in the next three days (further
#            ahead when they are few) for popularity, expected gameplay and competitive impact, and
#            writes nothing. Cents a day.
#            "full": Claude researches the day with web search and writes the overview (AI Summary),
#            league context and a sourced blurb for every match, and rates them. About $1.80 a day.
#   model    who does it: claude-haiku-5-5, claude-sonnet-5-5 or claude-opus-5-5 (Anthropic),
#            gpt-6-luna, gpt-6.1-sol or gpt-5.5 (OpenAI), gemini-3.1-flash-lite, gemini-3.8-flash or
#            gemini-3.1-pro-preview (Google). The full design needs claude-opus-5-5 or claude-sonnet-5-5.
#            Each provider needs its key as a repository secret: ANTHROPIC_API_KEY, OPENAI_API_KEY or
#            GEMINI_API_KEY. The Compare AI providers workflow measures the candidates on today's
#            fixtures; on 8 October 2026 gpt-6.1-sol's ratings cost $0.06 a run.
#   effort   how hard the model thinks: low or medium suit ratings. Claude takes low, medium, high,
#            xhigh or max; OpenAI none, minimal, low, medium, high, xhigh or max; Google minimal, low,
#            medium or high.
#   overview_model, overview_effort
#            the ratings design only, and optional (leave both out for no overview): once the ratings
#            are written, this model searches the web and writes the overview at the top of the page,
#            one plain paragraph about every match with known coverage in the time frame the top
#            three come from, on every service and in every competition, so it reads the same for
#            every visitor. It is published only with a page its own search returned. Any model above
#            that can search: claude-sonnet-5-5 or claude-opus-5-5, any OpenAI model, gemini-3.8-flash
#            or gemini-3.1-pro-preview. In a blind test on 8 October 2026 gemini-3.1-pro-preview's
#            overview was graded best, for about $0.05 to $0.08 a day (plus its searches).
#   blurbs_model, blurbs_effort
#            likewise for the cards: this model searches the web for a blurb on each of the six
#            best-scored matches in that time frame (the top three, and room for a visitor's league
#            priority to change them), each published only with a page its own search returned. In
#            the same test gpt-6.1-sol's blurbs were graded best, for about $0.13 a day.
#
# The commit that changes any of these rebuilds the page and writes that day's ratings (and overview)
# or storylines with the new choice at once (one paid run), rather than at the next morning's build.

[ai]
enabled = true
design = "ratings"
model = "gpt-6.1-sol"
effort = "low"
overview_model = "gemini-3.1-pro-preview"
overview_effort = "medium"
blurbs_model = "gpt-6.1-sol"
blurbs_effort = "medium"


# ---- Pick score ----------------------------------------------------------------------------------
# A match's interest is the AI rating and the Outlook score in proportion to `ai` and `outlook`;
# with AI off, or for a match without an AI rating, it is the Outlook score alone. The pick
# score, which chooses the top card's live match and the top three, is that interest and the
# visitor's league priority in proportion to `interest` and `league_priority`. Every score runs from
# 0 to 100, and each pair of weights needs at least one above 0.
#
# League priority spreads over the whole 0 to 100 range, in two clusters (the big leagues near the top,
# the rest near the bottom), while interest mostly sits between 40 and 65, so a small weight goes a long
# way: on 8 October 2026, at 20 it moved pick scores as much as interest's 80 did. At 5 it is a
# tiebreaker: about a fifth of interest's sway, and moving a league from last to first lifts its
# matches by 5 points.

[blend]
ai = 50
outlook = 50
interest = 95
league_priority = 5


# ---- Outlook score -------------------------------------------------------------------------------
# The page's own interest score, from ESPN's data alone: the same facts and the same arithmetic for
# every match, and nothing an AI wrote (the AI doesn't see it either, so each can check the other).
# Five parts, each from 0 to 1, combine in proportion to `weights`:
#
#   stature  the occasion: the competition's tier and any marquee clubs or nations (build.py's
#            stature score, divided by `stature_full` and capped at 1)
#   close    how evenly matched, from the betting market's implied chance of a draw: `draw_from` or
#            less is 0, `draw_to` or more is 1
#   stakes   the table, from each team's place (1 for first, 0 for last): the lower-placed team's
#            place, so a meeting near the top counts most; or, when more, `bottom` times the
#            higher-placed team's distance from the top, so a meeting near the bottom counts too.
#            A knockout round takes its value from `knockout` instead, by the longest of its words
#            found in ESPN's stage name ("Semifinals" is a semifinal, not a final).
#   tv       a broadcast network listed (1), else a cable channel (0.5), else neither (0), from the
#            channel lists below, which use rights.toml's names
#   goals    the betting market's goal line: `goals_from` or less is 0, `goals_to` or more is 1
#
# A part the data says nothing about (no odds, no table, no broadcaster listed yet) counts as
# `missing`, so it neither helps nor hurts. The odds are DraftKings' prices from ESPN's scoreboard;
# they shape this score and are never shown on the page.

[outlook]
weights = { stature = 40, close = 25, stakes = 15, tv = 10, goals = 10 }
missing = 0.5
stature_full = 150
draw_from = 0.10
draw_to = 0.30
bottom = 0.6
goals_from = 2.0
goals_to = 4.0
knockout = { "final" = 1.0, "semifinal" = 0.9, "quarterfinal" = 0.8, "round of 16" = 0.7, "playoff" = 0.7 }
network = ["ABC", "CBS", "FOX", "NBC", "Telemundo", "Univision", "UniMás"]
cable = ["ESPN", "ESPN2", "ESPN Deportes", "FS1", "FS2", "Fox Deportes", "USA Network", "CBS Sports Network",
         "TNT", "TBS", "truTV", "TUDN", "Universo", "beIN Sports", "beIN Sports en Español"]
