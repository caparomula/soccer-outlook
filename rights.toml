"FS2"                       = {}
"FOX"                       = { free = true }
"Fox Deportes"              = { es = true }
"Big Ten Network"           = { espn = ["BTN"] }
"Fox Soccer Plus"           = { espn = ["FSP"] }
"Fox Sports app"            = {}
"Paramount+"                = {}
"CBS"                       = { free = true }
"CBS Sports Network"        = { espn = ["CBSSN"] }
