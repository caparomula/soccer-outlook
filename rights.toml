# ---- Simulcasts --------------------------------------------------------------------------------
# A channel that a service streams for some competitions only.

[[simulcasts]]
channel = "CBS Sports Network"
service = "para"
leagues = ["ita.1", "eng.w.1", "uefa.champions", "uefa.europa", "uefa.europa.conf", "uefa.wchampions", "sco.1",
           "eng.league_cup", "ita.coppa_italia", "eng.2"]
note = "Every match of these competitions streams on Paramount+. Not confirmed for the NWSL."
source = "ESPN listings, Sept 1 to Oct 16 2026: every Serie A, Champions League, Europa League and Women's Super League match on CBSSN was also listed on Paramount+"
checked = 2026-10-06


# ---- Competitions ------------------------------------------------------------------------------
# By ESPN's league id (the competitions themselves are listed in build.py). `usual` is the channel
# that carries every match ESPN hasn't listed yet, shown as "usually ..." on the page. It holds
# for one `season` and lapses after `until`, so that a rights change at the turn of a season can't
# leave a wrong claim standing: after that the page shows no usual home until the entry is
# confirmed again. `hint` is free text for where a competition lives otherwise.

[leagues."eng.1"]
hint = "NBC, USA Network or Peacock · channel posted a few days out"
source = "https://www.nbcsports.com/pressbox/press-releases/the-premier-league-is-back-the-2026-27-season-begins-in-three-days-across-nbcuniversal-platforms-featuring-nbc-sports-premier-league-live-studio-team-on-the-ground-in-the-u-k"
