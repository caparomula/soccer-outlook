"Apple TV"                  = { espn = ["Apple TV+", "MLS Season Pass"] }
"USA Network"               = { espn = ["USA", "USA Net"] }
"NBC"                       = { free = true }
"Peacock"                   = {}
"NBCSN"                     = {}
"CNBC"                      = {}
"Telemundo"                 = { espn = ["Tele"], free = true, es = true }
"Universo"                  = { es = true }
"HBO Max"                   = { espn = ["Max"] }
"TNT"                       = {}
"TBS"                       = {}
"truTV"                     = {}
"Prime Video"               = { espn = ["Amazon Prime Video"] }
"Netflix"                   = {}
"Disney+"                   = {}
"ION"                       = { free = true }
"The Roku Channel"          = { espn = ["Roku"], free = true }
"Victory+"                  = { free = true }
"Fandango"                  = { free = true }
