# Who shows what in the US: the facts behind every "where to watch" on the page.
#
# ESPN's listings name each match's broadcasters ("FS2", "USA Net"), usually only a few days out.
# This file says which streaming services carry each broadcaster, and where a competition usually
# lives when nothing is listed yet. Rights and carriage change every season and sometimes in the
# middle of one (a carriage dispute can black a channel out for months), and ESPN's data shows none
# of that, so every fact names where it came from and the date it was last checked.
#
# Each build checks this file and refuses to publish if it contradicts itself. It also warns, on
# the Actions run page and in a GitHub issue, when ESPN uses a broadcaster name that isn't here,
# when a competition's usual home disagrees with what ESPN lists or reaches the end of its season,
# and when an entry hasn't been checked for 180 days.
#
# To update: research the change (Claude Code with web search does this well), edit the entry,
# give its source and today's date as `checked`, and run `python3 -m unittest -v` before pushing
# (it should report 30 or more tests).


# ---- Channels ----------------------------------------------------------------------------------
# Every broadcaster ESPN lists, under the name the page shows. `espn` holds the other names ESPN
# uses for it (matched in any case; the name itself always matches). `free` marks one anyone can
# watch, over the air or in a free app; `es` marks a Spanish-language one. A channel no service
# carries can stay here so that its name is recognized.

[channels]
"ESPN+"                     = {}
"ESPN Unlimited"            = { espn = ["ESPN Unlmtd"] }
"ESPN"                      = {}
"ESPN2"                     = {}
"ESPNU"                     = {}
"ESPNEWS"                   = {}
"ESPN Deportes"             = { es = true }
"ACC Network"               = { espn = ["ACCN"] }
"SEC Network"               = { espn = ["SECN"] }
"ABC"                       = { free = true }
